## Padrões AGP 9.x+ - Todos os valores false/legados removidos.
## Propriedades cujo novo default é 'true' são omitidas (AGP 9 assume automaticamente).

# --- Core Android ---
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36

# --- Performance JVM ---
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true

# --- Kotlin ---
kotlin.code.style=official

# --- R8 Full Mode (padrão moderno, remoção de dead code mais agressiva) ---
android.r8.strictFullModeForKeepRules=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
